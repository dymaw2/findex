[project]
name = "findex"
version = "0.1.0"
description = "Full-text search engine built across 8 Python labs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/findex"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]
